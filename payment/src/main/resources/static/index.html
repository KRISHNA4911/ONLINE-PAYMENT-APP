

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome Krishna Donation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url('/images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 28px 22px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
        }

        .container::before {
            content: "🦚";
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            background: white;
            border-radius: 50%;
            padding: 10px;
        }

        h1 { margin-top: 30px; color: #6a1b9a; font-size: 24px; }
        p { color: #444; font-size: 15px; margin: 14px 0; }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            background: linear-gradient(135deg, #43cea2, #185a9d);
            color: white;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 22px rgba(0,0,0,0.25);
        }

        .amount-box {
            background: linear-gradient(135deg, #ffcc80, #ffe0b2);
            padding: 14px;
            border-radius: 12px;
            margin: 15px 0;
            font-size: 17px;
            font-weight: bold;
            color: #e65100;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        footer { margin-top: 18px; font-size: 13px; color: #777; }

        .donor-btn {
            display: inline-block;
            margin-left: 6px;
            padding: 6px 14px;
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: #fff;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 20px;
            background: linear-gradient(135deg, #00c853, #2e7d32);
            color: #ffffff;
            border-radius: 22px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .thank-popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .thank-box {
            width: 100%;
            max-width: 320px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            padding: 26px;
            border-radius: 26px;
            text-align: center;
            animation: popup 0.4s ease;
        }

        .thank-box h2 { color: #ffffff; }

        @keyframes popup {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WELCOME TO KRISHNA DONATION</h1>
    <p>Support devotion & positivity.<br>Your small contribution makes a big difference.</p>

    <div class="input-group">
        <input type="text" id="userName" placeholder="Enter your name">
        <input type="number" id="amount" placeholder="Enter donation amount (₹)" min="1" max="10000" step="1">
    </div>

    <button onclick="startPayment()">Pay Now</button>

    <div class="amount-box" onclick="goToLove()">About Us 💖</div>

    <footer>
        Thank you for your kindness 🌸
        <p style="margin-top:10px;">Click to know about <span class="donor-btn" onclick="viewDonors()">Donors</span></p>
        <div class="admin-btn" onclick="goToAdmin()">🔐 Admin Panel</div>
        <div style="margin-top: 15px; color: #1b5e20; font-weight: 800; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(27, 94, 32, 0.3), 0 1px 2px rgba(0,0,0,0.15);">DEVELOPED BY - KRISHNA SAHU</div>
    </footer>
</div>

<div id="thankPopup" class="thank-popup">
    <div class="thank-box">
        <h2>Thank you for Your Donation 😊</h2>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    function startPayment() {
        const nameInput = document.getElementById("userName").value.trim();
        const amountInput = document.getElementById("amount").value.trim();
        const amount = Number(amountInput);

        // 1. If BOTH are empty
        if (nameInput === "" && amountInput === "") {
            alert("Please enter a valid name and amount");
            return;
        }

        // 2. If only Name is empty
        if (nameInput === "") {
            alert("Please enter your name");
            return;
        }

        // 3. If Amount is empty, not a number, or out of range (1-10k)
        if (amountInput === "" || isNaN(amount) || amount < 1 || amount > 10000) {
            alert("Please enter a value between ₹1 and ₹10,000");
            return;
        }

        // 4. Ensure it's a whole number (No 0.1, 5.5, etc.)
        if (!Number.isInteger(amount)) {
            alert("Please enter a valid  amount");
            return;
        }

        // Proceed to Razorpay Order Creation
        fetch("/create-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ userName: nameInput, amount: amount })
        })
        .then(res => res.json())
        .then(data => {
            var options = {
                key: "rzp_test_RtR6TqgMazIdkg", 
                amount: data.amount * 100,
                currency: "INR",
                order_id: data.orderId,
                name: "Krishna Donation",
                description: "Donation by " + nameInput,
                handler: function (response) {
                    fetch("/payment-success", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            orderId: data.orderId,
                            paymentId: response.razorpay_payment_id,
                            status: "SUCCESS"
                        })
                    });

                    document.getElementById("thankPopup").style.display = "flex";
                    setTimeout(() => {
                        document.getElementById("thankPopup").style.display = "none";
                    }, 3000);
                }
            };

            var rzp = new Razorpay(options);
            rzp.on('payment.failed', function (response) {
                alert("Payment Failed ❌");
            });
            rzp.open();
        })
        .catch(err => alert("Connection error. Please try again."));
    }

    function viewDonors() { window.location.href = "donors.html"; }
    function goToAdmin() { window.location.href = "admin.html"; }
    function goToLove() { window.location.href = "love.html"; }
</script>

</body>
</html>
